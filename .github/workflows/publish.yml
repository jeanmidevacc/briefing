name: Publish

# Publishes to PyPI on a GitHub Release, using Trusted Publishing (OIDC) — no
# PyPI token or repository secret — then rebuilds the docs on Read the Docs
# (docs.yml, with the RTD_TOKEN secret of the pypi environment). Run manually (workflow_dispatch)
# to push a build to TestPyPI first.
#
# One-time setup on PyPI (and TestPyPI):
#   Account → Publishing → Add a pending publisher
#     PyPI project name:  briefing
#     Owner:              jeanmidevacc
#     Repository name:     briefing
#     Workflow filename:   publish.yml
#     Environment name:    pypi        (testpypi for the TestPyPI publisher)
# And in this repo: Settings → Environments → create "pypi" and "testpypi".

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout needs this; workflow default above is {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Tag must match package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -Po '^__version__ = "\K[^"]+' src/briefing/_version.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version   release tag: $tag"
          test "$version" = "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/briefing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke:
    # The release as a user gets it (#198): install it from PyPI in a clean runner, check its
    # version, and build the project `python -m briefing new` writes. PyPI's index can lag a
    # minute behind the upload, so the install retries.
    needs: pypi
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the release from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 20); do
            pip install --no-cache-dir "briefing==$version" && break
            echo "not on the index yet ($attempt)"; sleep 15
          done
          python -c "import briefing, sys; print(briefing.__version__); sys.exit(briefing.__version__ != '$version')"
      - name: Build a new project
        working-directory: ${{ runner.temp }}
        run: |
          python -m briefing new smoke --title "Smoke test"
          cd smoke
          python build_report.py
          grep -q "Made with briefing ${GITHUB_REF_NAME#v}" reports/index.html

  docs:
    # The release's documentation: rebuild `stable` and `latest` on Read the Docs. docs.yml
    # runs on its own (as `gh workflow run docs.yml` does by hand), because the RTD_TOKEN
    # secret of the `pypi` environment doesn't reach it when it is called as a reusable
    # workflow (the 0.4.0 release found that). A workflow_dispatch from GITHUB_TOKEN does run.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the Docs workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/briefing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
