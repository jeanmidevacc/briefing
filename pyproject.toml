[build-system]
# <1.27 keeps the built metadata at version 2.3. 1.27+ emits 2.4/2.5, which
# current `twine check` and some install toolchains still reject.
requires = ["hatchling>=1.21,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/briefing/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing"]

[tool.hatch.build.targets.sdist]
include = [
    "src/briefing",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "noxfile.py",
    "pyproject.toml",
]

[project]
name = "briefing"
dynamic = ["version"]
description = "Build beautiful self-contained HTML reports from Python analysis"
readme = "README.md"
requires-python = ">=3.11"
# Kept as a text table (not the PEP 639 SPDX string) — combined with the
# hatchling<1.27 pin this keeps the built metadata at version 2.3, which
# `twine check` and older install toolchains still accept (2.4/2.5 they reject).
license = { text = "Apache-2.0" }
authors = [{ name = "jeanmidevacc" }]
keywords = ["data", "reporting", "html", "pandas", "polars", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
# The core install has ZERO visualisation-library dependencies. It renders the
# report grammar (Text, Table, BigNumber, layout, ...) with only Jinja2 +
# markdown-it-py. Charts come from either the `Plot` block (bring your own
# Plotly/Altair/Matplotlib/Bokeh figure — install the matching extra) or the
# `briefing.lab` custom-visualisation blocks (`pip install briefing[lab]`).
# Table/DataTable use pandas as the internal engine — `pip install briefing[pandas]`
# (other dataframe libraries are accepted as input and converted).
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    # Code: syntax highlighting at render time, coloured by the theme
    "pygments>=2.15",
    # Formula: LaTeX → MathML at render time (pure Python, MIT, no dependencies)
    "latex2mathml>=3.77",
    # Table, DataTable, the lab blocks and tables written in JSON (#40); imported only when used
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/jeanmidevacc/briefing"
Documentation = "https://briefing.readthedocs.io"
Repository = "https://github.com/jeanmidevacc/briefing"
Issues = "https://github.com/jeanmidevacc/briefing/issues"
Changelog = "https://github.com/jeanmidevacc/briefing/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The `Plot` block is a bring-your-own-figure escape hatch: it renders the figure you pass, from
# the library you already have, and checks that library's version (#40). Only Altair needs more:
# vl-convert-python supplies the Vega runtime that briefing embeds, so charts work offline.
altair = ["altair>=5.0", "vl-convert-python>=1.0"]
# pip install briefing[lab] — briefing.lab (DataProfile, DataDive, CalendarHeatmap) needs nothing
#   beyond the core today; the extra stays so existing installs work and lab can grow here.
lab = []
# pip install briefing[pillow] — Image/Banner(max_width=, format=, quality=): lighter pictures (#186)
pillow = ["pillow>=10.0"]
# pip install briefing[image] — bf.save_image / bf.save_pdf in headless Chromium;
#   run `playwright install chromium` once after installing
image = ["playwright>=1.40"]
# pip install briefing[docs] — build the Sphinx site (nox -s docs); the examples it
#   runs need pandas and the chart libraries, not Playwright
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.0",
]
# pip install briefing[dev]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-snapshot>=0.9",
    "beautifulsoup4>=4.14",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "nox>=2024.4",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pyarrow>=15.0",
    # bf.datasets.load(engine="polars") and polars intake (#46)
    "polars>=1.0",
    # exercised by the Plot renderer and contract tests so the adapter branches are covered
    "plotly>=5.0",
    "matplotlib>=3.7",
    "altair>=5.0",
    "vl-convert-python>=1.0",
    # Image/Banner(max_width=, format=) (#186)
    "pillow>=10.0",
    # browser tests (pytest -m browser); run `playwright install chromium` once
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=briefing --cov-report=term-missing -v"
markers = [
    "browser: opens rendered reports in headless Chromium (pytest -m browser; needs `playwright install chromium`)",
]

[tool.coverage.run]
source = ["src/briefing"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
# The renderers build HTML as aligned multi-line f-strings; 120 keeps those
# readable without a wholesale reformat.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally poke deprecated / dynamic attributes.
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional plotting / markdown / dataframe libraries ship no (or partial) type information.
[[tool.mypy.overrides]]
module = [
    "plotly.*", "altair.*", "bokeh.*", "matplotlib.*", "seaborn.*", "plotnine.*",
    "markdown_it.*", "pygments.*", "pyarrow.*",
]
ignore_missing_imports = true

# Tests: still type-checked, but pytest functions need not be annotated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
